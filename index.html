<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>
    <link rel="icon" href="https://1000logos.net/wp-content/uploads/2016/10/Amazon-logo-meaning.jpg" type="x-icon" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="main-div">
        <div class="inner-div">
            <a href="https://www.amazon.in/" target="_blank">
                <img src="amazon logo.webp" alt="try again later" height="50" width="150">
            </a>
            <h1 class="logo-edit">.in</h1>
        </div>
        <form>
            <div class="signup-form">
                <h2>Sign in or create account</h2>
                <strong><p>Enter mobile number or email</p></strong>
                <input type="text" placeholder=" " class="hi"/>
                <div class="button-div">
                    <button class="signup-btn">Continue</button>
                </div>
                <div>
                    <small>By continuing, you agree to Amazon's <a href="https://www.amazon.in/gp/help/customer/display.html/ref=ap_signin_notification_condition_of_use?nodeId=GLSBYFE9MGKKQXXM&ie=UTF8&ref_=ap_signin_notification_condition_of_use">Conditions of Use</a> and <a href="https://www.amazon.in/gp/help/customer/display.html/ref=ap_signin_notification_privacy_notice?nodeId=GX7NJQ4ZB8MHFRNJ&ie=UTF8&ref_=ap_signin_notification_privacy_notice"> Privacy Notice.</a></small>
                </div>
                <hr class="hr">
                <div class="jithu">
                    <h3>Buying for work?</h3>
                    <a href="https://www.amazon.in/business/register/org/landing?ref_=ab_reg_signin_unifiedauth" class="sam">
                        <h4>Create a free Business account</h4>
                    </a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
